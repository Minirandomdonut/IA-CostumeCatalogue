<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="950" viewBox="0 0 1380 950"><rect width="1380" height="950" fill="#fff"/><rect x="21.5" y="31.5" width="1318" height="828" fill="#fff" stroke="#000" stroke-width="3"/><g font-family="Menlo, 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', monospace" font-size="28" fill="#000"><text x="40.0" y="71" font-weight="bold">FUNCTION IMPORT_FILE(CATALOGUE, PATH, SHEET)</text><text x="107.33" y="111">REVIEW_LIST = empty list</text><text x="107.33" y="151">FOR EACH ROW IN SHEET</text><text x="174.67" y="191">// an empty cost is not a number, so this also catches missing costs</text><text x="174.67" y="231">IF ROW.NAME = EMPTY OR NOT IS_NUMBER(ROW.COST) THEN</text><text x="242.0" y="271">APPEND ROW TO REVIEW_LIST</text><text x="174.67" y="311">ELSE</text><text x="242.0" y="351">PRODUCT = NEW PRODUCT(ROW.NAME, ROW.COST, ...)</text><text x="242.0" y="391">CALL COMPUTE_PRICES(PRODUCT)</text><text x="242.0" y="431">IF ROW.RETAIL &lt;&gt; EMPTY THEN</text><text x="309.33" y="471">IF ROW.RETAIL &lt;&gt; PRODUCT.RETAIL THEN</text><text x="376.67" y="511">PRODUCT.RETAIL = ROW.RETAIL</text><text x="376.67" y="551">PRODUCT.MANUAL_RETAIL = TRUE</text><text x="309.33" y="591">END IF</text><text x="242.0" y="631">END IF</text><text x="242.0" y="671">ADD PRODUCT TO CATALOGUE</text><text x="174.67" y="711">END IF</text><text x="107.33" y="751">END FOR</text><text x="107.33" y="791">RETURN REVIEW_LIST</text><text x="40.0" y="831" font-weight="bold">END FUNCTION</text></g><text x="20" y="901" font-family="Verdana, 'DejaVu Sans', 'Bitstream Vera Sans', sans-serif" font-size="23.5" fill="#000">Figure 10. Pseudocode — Import</text></svg>