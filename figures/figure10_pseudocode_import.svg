<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="1150" viewBox="0 0 1464 1150"><rect width="1464" height="1150" fill="#fff"/><rect x="21.5" y="31.5" width="1402" height="1028" fill="#fff" stroke="#000" stroke-width="3"/><g font-family="Menlo, 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', monospace" font-size="28" fill="#000"><text x="40.0" y="71" font-weight="bold">FUNCTION IMPORT_FILE(CATALOGUE, PATH, SHEET)</text><text x="107.33" y="111">REVIEW_LIST = empty list</text><text x="107.33" y="151">FOR EACH ROW IN SHEET</text><text x="174.67" y="191">// refinement: the real lists have blank spacer rows; skip, do not review</text><text x="174.67" y="231">IF EVERY CELL IN ROW IS EMPTY THEN</text><text x="242.0" y="271">SKIP TO NEXT ROW</text><text x="174.67" y="311">END IF</text><text x="174.67" y="351">// IS_NUMBER is false for text, empty cells, zero and negative costs</text><text x="174.67" y="391">IF ROW.NAME = EMPTY THEN</text><text x="242.0" y="431">APPEND (ROW, "name missing") TO REVIEW_LIST</text><text x="174.67" y="471">ELSE IF NOT IS_NUMBER(ROW.COST) THEN</text><text x="242.0" y="511">APPEND (ROW, "cost missing or not a number") TO REVIEW_LIST</text><text x="174.67" y="551">ELSE</text><text x="242.0" y="591">PRODUCT = NEW PRODUCT(ROW.NAME, ROW.COST, ...)</text><text x="242.0" y="631">ADD PRODUCT TO CATALOGUE     // the catalogue calls COMPUTE_PRICES</text><text x="242.0" y="671">IF ROW.RETAIL &lt;&gt; EMPTY THEN</text><text x="309.33" y="711">IF ROW.RETAIL &lt;&gt; PRODUCT.RETAIL THEN</text><text x="376.67" y="751">PRODUCT.RETAIL = ROW.RETAIL</text><text x="376.67" y="791">PRODUCT.MANUAL_RETAIL = TRUE</text><text x="309.33" y="831">END IF</text><text x="242.0" y="871">END IF</text><text x="174.67" y="911">END IF</text><text x="107.33" y="951">END FOR</text><text x="107.33" y="991">RETURN REVIEW_LIST</text><text x="40.0" y="1031" font-weight="bold">END FUNCTION</text></g><text x="20" y="1101" font-family="Verdana, 'DejaVu Sans', 'Bitstream Vera Sans', sans-serif" font-size="23.5" fill="#000">Figure 10. Pseudocode — Import</text></svg>