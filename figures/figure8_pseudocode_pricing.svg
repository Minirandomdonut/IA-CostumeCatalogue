<svg xmlns="http://www.w3.org/2000/svg" width="724" height="550" viewBox="0 0 724 550"><rect width="724" height="550" fill="#fff"/><rect x="21.5" y="31.5" width="662" height="428" fill="#fff" stroke="#000" stroke-width="3"/><g font-family="Menlo, 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', monospace" font-size="28" fill="#000"><text x="40.0" y="71" font-weight="bold">FUNCTION COMPUTE_PRICES(PRODUCT)</text><text x="107.33" y="111">PW = PRODUCT.COST * 1.25 * 1.16</text><text x="107.33" y="151">PW = CEILING(PW / 5) * 5</text><text x="107.33" y="191">IF NOT PRODUCT.MANUAL_RETAIL THEN</text><text x="174.67" y="231">PR = PW * 1.15</text><text x="174.67" y="271">PR = CEILING(PR / 5) * 5</text><text x="174.67" y="311">PRODUCT.RETAIL = PR</text><text x="107.33" y="351">END IF</text><text x="107.33" y="391">PRODUCT.WHOLESALE = PW</text><text x="40.0" y="431" font-weight="bold">END FUNCTION</text></g><text x="20" y="501" font-family="Verdana, 'DejaVu Sans', 'Bitstream Vera Sans', sans-serif" font-size="23.5" fill="#000">Figure 8. Pseudocode — Pricing</text></svg>