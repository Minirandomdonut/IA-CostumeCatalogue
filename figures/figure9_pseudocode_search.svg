<svg xmlns="http://www.w3.org/2000/svg" width="1027" height="590" viewBox="0 0 1027 590"><rect width="1027" height="590" fill="#fff"/><rect x="21.5" y="31.5" width="965" height="468" fill="#fff" stroke="#000" stroke-width="3"/><g font-family="Menlo, 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', monospace" font-size="28" fill="#000"><text x="40.0" y="71" font-weight="bold">FUNCTION SEARCH(CATALOGUE, QUERY)</text><text x="107.33" y="111">MATCHES = empty list</text><text x="107.33" y="151">FOR EACH PRODUCT IN CATALOGUE.PRODUCTS</text><text x="174.67" y="191">SCORE = SIMILARITY(QUERY, PRODUCT.NAME)</text><text x="174.67" y="231">IF SCORE &gt;= 0.70 THEN</text><text x="242.0" y="271">APPEND (PRODUCT, SCORE) TO MATCHES</text><text x="174.67" y="311">END IF</text><text x="107.33" y="351">END FOR</text><text x="107.33" y="391">SORT MATCHES BY SCORE IN DESCENDING ORDER</text><text x="107.33" y="431">RETURN FIRST 4 ELEMENTS OF MATCHES, OR ALL IF FEWER</text><text x="40.0" y="471" font-weight="bold">END FUNCTION</text></g><text x="20" y="541" font-family="Verdana, 'DejaVu Sans', 'Bitstream Vera Sans', sans-serif" font-size="23.5" fill="#000">Figure 9. Pseudocode — Search</text></svg>